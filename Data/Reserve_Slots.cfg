# =============================================================================
# Reserve Slots Configuration File
# =============================================================================
# This file controls how hero and town reserve slots work in your game.
# Each setting can be modified to customize the reserve slot experience.
# 
# Boolean values: 1 = enabled, 0 = disabled
# Numeric values: Use positive integers only
# =============================================================================

# =============================================================================
# HERO SETTINGS
# =============================================================================
[HeroSettings]

# Enable/disable hero reserve slots entirely
# 1 = Heroes can use reserve slots, 0 = No hero reserves
HeroReservesEnabled=1

# Show the reserve button in hero dialogs
# 1 = Button visible, 0 = Button hidden (reserves still work via hotkey)
HeroReserveButtonShow=1

# Number of rows in the hero reserve grid (1-4)
# Determines vertical size of the reserve slot interface
# Total slots = HeroReserveRows × 7 (always 7 columns)
HeroReserveRows=4

# =============================================================================
# HERO PROGRESSION SYSTEM
# =============================================================================
[HeroProgression]

# Level-based progression: Slots unlock as hero gains levels
# 1 = Enabled, 0 = Disabled
# Formula: Starting slots + (Hero Level ÷ Levels per slot)
# Example: Level 10+ = 1 extra slot, Level 20+ = 2 extra slots, etc.
HeroProgressionLevelBased=1

# Skill + Level progression: Combines level progression with secondary skill
# 1 = Enabled, 0 = Disabled  
# Formula: Level progression + Secondary skill contribution
# Both level-based AND skill-based slots are earned
HeroProgressionSkillBased=1

# Purchase-based progression: Slots must be bought with resources
# 1 = Enabled, 0 = Disabled
# Allows purchasing additional slots beyond other progression methods
# NOTE: Purchased slots are always per-player (apply to all player's heroes)
HeroProgressionPurchaseBased=0

# Number of reserve slots each hero starts with (minimum 1)
# Base amount before any progression bonuses
HeroStartingSlots=1

# Hero levels required to unlock each additional slot
# Slots unlock at: Level 10, 20, 30, 40, etc. (with value 10)
# Hero gets starting slots + (level ÷ this value) additional slots
HeroLevelsPerSlot=10

# Which secondary skill contributes to slot unlocking (0-28+)
# Default 20 = your custom skill, 28 = Recruitment in some mods
# Skill levels: Basic=1 slot, Advanced=1 slot, Expert=2 slots
HeroUnlockSecondarySkill=20

# Base cost in gold for purchasing the first additional slot
# Each subsequent slot costs more based on the multiplier
# NOTE: Purchased slots apply to ALL of the player's heroes
HeroPurchaseBaseCost=1000

# Cost multiplier as percentage (100 = same cost, 150 = +50% each time)
# Formula: Next cost = Previous cost × (Multiplier ÷ 100)
HeroPurchaseCostMultiplier=150

# Require wood for purchasing slots (1 = yes, 0 = no)
# Wood cost = Gold cost ÷ 400
HeroPurchaseRequiresWood=1

# Require ore for purchasing slots (1 = yes, 0 = no)  
# Ore cost = Gold cost ÷ 400
HeroPurchaseRequiresOre=1

# =============================================================================
# HERO BATTLE SETTINGS
# =============================================================================
[HeroBattle]

# Increase surrender cost when hero has creatures in reserves
# 1 = Higher surrender cost with reserves, 0 = Normal cost
IncreaseSurrenderCost=1

# Keep reserve creatures when retreating from battle
# 1 = Reserves survive retreat, 0 = Reserves lost on retreat
KeepReservesOnRetreat=0

# =============================================================================
# TOWN SETTINGS  
# =============================================================================
[TownSettings]

# Enable/disable town reserve slots entirely
# 1 = Towns can use reserve slots, 0 = No town reserves
TownReservesEnabled=1

# Number of rows in the town reserve grid (1-4)
# Determines vertical size of the reserve slot interface
# Total slots = TownReserveRows × 7 (always 7 columns)
TownReserveRows=4

# =============================================================================
# TOWN PROGRESSION SYSTEM
# =============================================================================
[TownProgression]

# Purchase-based progression: Slots must be bought with resources
# 1 = Enabled, 0 = Disabled
# NOTE: Purchased slots are always per-player (apply to all player's towns)
TownProgressionPurchaseBased=1

# Number of reserve slots each player starts with for towns
# All of player's towns begin with this many slots available
TownStartingSlots=1

# Base cost in gold for purchasing the first additional town slot
# NOTE: Purchased slots apply to ALL of the player's towns
TownPurchaseBaseCost=1000

# Cost multiplier as percentage for each subsequent slot purchase
# Formula: Next cost = Previous cost × (Multiplier ÷ 100)
TownPurchaseCostMultiplier=115

# Require wood for purchasing town slots (1 = yes, 0 = no)
# Wood cost = Gold cost ÷ 400
TownPurchaseRequiresWood=1

# Require ore for purchasing town slots (1 = yes, 0 = no)
# Ore cost = Gold cost ÷ 400  
TownPurchaseRequiresOre=1

# Require hero to be in a friendly town to purchase reserve slots
# 1 = Hero must visit own town or allied town to purchase
# 0 = Hero can purchase reserve slots anywhere on the map
# Friendly towns include: own towns and teammate towns (same team)
HeroPurchaseRequiresTownVisit=1

# =============================================================================
# TOWN CAPTURE BEHAVIOR
# =============================================================================
[TownCapture]

# Keep reserves accessible when town is captured
# 1 = New owner gets access to existing reserves
# 0 = Reserves are handled by other options below
TownCaptureKeepReserves=0

# Clear all reserves when town is captured  
# 1 = All creatures in reserves are lost on capture
# 0 = Reserves are handled by other options
TownCaptureClearReserves=0

# Lock reserves when town is captured (recommended)
# 1 = Previous owner's reserves are locked, new owner starts fresh
# 0 = Reserves are handled by other options above
# If original owner recaptures, they regain access to locked reserves
TownCaptureLockReserves=1

# =============================================================================
# CONFIGURATION NOTES
# =============================================================================
#
# RESERVE SLOT SYSTEM:
# - Heroes: Each hero has individual reserves per player
# - Towns: Each town has individual reserves per player  
# - When ownership changes: New owner sees their own reserves for that hero/town
# - Previous owner's reserves remain but are not accessible to new owner
#
# HERO PROGRESSION COMBINATIONS:
# - Multiple progression types can be enabled simultaneously
# - Level + Skill: Hero gets slots from both leveling and secondary skill
# - Level + Purchase: Hero gets free slots from leveling + player can buy more
# - All types: Hero benefits from all progression methods combined
#
# TOWN PROGRESSION:
# - Purchase-based: Player buys slots that apply to ALL their towns
# - All purchased slots are always shared across player's towns
#
# RESOURCE COSTS:
# - Gold cost scales with multiplier for each purchase
# - Wood/Ore costs are always Gold cost ÷ 400
# - Example: 1000 gold = 2.5 wood + 2.5 ore when both required
#
# OWNERSHIP CHANGES:
# - Hero reserves are per [player][hero] - each player has separate reserves
# - Town reserves are per [player][town] - each player has separate reserves
# - When hero/town changes hands, new owner sees fresh reserves or their old ones
# - Original owner's reserves are preserved but inaccessible to new owner
#
# SAVE COMPATIBILITY:
# - Configuration changes apply to new games immediately
# - Existing saves may need new game for some changes to take effect
# - All progression and reserves are saved with the game
#
# =============================================================================