[HeroSettings]
; Enable/disable hero reserves entirely (0=disabled, 1=enabled)
HeroReservesEnabled=1

; Whether to show the Reserve button in hero screen
HeroReserveButtonShow=1

; Number of hero reserve rows to display (1-4, default: 1)
; Each row can hold up to 7 creature slots
HeroReserveRows=4

; Number of hero slots per row (1-7, default: 7)
; This determines how many creature slots are in each row
HeroSlotsPerRow=7

[HeroProgression]
; Hero Progression Types:
; 0 = None (all slots unlocked)
; 1 = Level-based (slots unlock with hero level)
; 2 = Skill-based (slots unlock with level + Recruitment secondary skill)
; 3 = Skill-only (slots unlock based on secondary skill only)
; 4 = Purchase-based (slots unlock with level + must be purchased) // not implemented
HeroProgressionType=2

; Starting number of slots for heroes (minimum 1)
HeroStartingSlots=1

; How many hero levels needed per additional slot
HeroLevelsPerSlot=8

; Base cost for purchasing first hero slot (for purchase-based progression)
HeroPurchaseBaseCost=1000

; Cost multiplier as percentage (150 = 150% of previous cost)
HeroPurchaseCostMultiplier=150

; Whether purchasing hero slots requires wood/ore resources
HeroPurchaseRequiresWood=0
HeroPurchaseRequiresOre=0

[HeroBattle]
; Whether to increase surrender cost based on reserve units
IncreaseSurrenderCost=1

; Whether to keep reserves when retreating (otherwise reserves are lost)
KeepReservesOnRetreat=0

[TownSettings]
; Enable/disable town reserves entirely (0=disabled, 1=enabled)
TownReservesEnabled=1

; Number of town reserve rows to display (1-4, default: 1)
; Each row can hold up to 7 creature slots
TownReserveRows=4

; Number of town slots per row (1-7, default: 7)
; This determines how many creature slots are in each row
TownSlotsPerRow=7

[TownProgression]
; Town Progression Types:
; 0 = None: All town reserve slots unlocked from start
; 1 = Purchase-based: Players must buy slots with gold/resources
; 2 = Player-based: Slots unlock based on player's highest hero level OR town count
TownProgressionType=1

; Number of slots each player starts with for ALL their towns
TownPlayerStartingSlots=1

; Levels or towns needed per additional slot
TownPlayerLevelsPerSlot=3

; Base cost in gold for purchasing first slot
TownPurchaseBaseCost=2000

; Cost multiplier for each additional purchase (150%)
TownPurchaseCostMultiplier=125

; Whether purchasing town slots requires wood/ore resources
TownPurchaseRequiresWood=1
TownPurchaseRequiresOre=1

[TownCapture]
; What happens to reserves when town is captured:
; 0 = Keep Reserves: New owner inherits all existing reserves and can use them
; 1 = Clear Reserves: All reserves are destroyed when town changes hands
; 2 = Lock Reserves: Original owner keeps reserves, new owner starts with empty reserves
TownCaptureReserveBehavior=2